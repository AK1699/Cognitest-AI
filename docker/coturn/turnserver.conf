# TURN Server Configuration for WebRTC NAT Traversal
# Coturn - Open source TURN server implementation

# Listening ports
listening-port=3478
listening-ip=0.0.0.0
external-ip=0.0.0.0/0.0.0.0

# TLS
tls-listening-port=5349
cert=/etc/coturn/certs/cert.pem
pkey=/etc/coturn/certs/pkey.pem

# STUN/TURN realm (should match your domain in production)
realm=cognitest.local

# Credentials
user=cognitest:cognitest123

# Verbosity
log-file=/var/log/coturn/turn.log
verbose

# Performance tuning
max-bps=0
bps-capacity=0
max-clients=1000

# Security
fingerprint
lt-cred-mech
no-multicast-peers
no-loopback-peers

# Relay options
relay-ip=0.0.0.0
relay-threads=50

# NAT behavior detection
check-origin-consistency
