[supervisord]
logfile=/var/log/supervisor/supervisord.log
loglevel=info
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
nodaemon=true

# Unix socket for supervisor communications
[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

# RPC interface for health checks
[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# ==========================================
# Xvfb Virtual Display (X11)
# ==========================================
[program:xvfb]
command=/usr/bin/Xvfb %(ENV_DISPLAY)s -screen 0 %(ENV_XVFB_DISPLAY_WIDTH)sx%(ENV_XVFB_DISPLAY_HEIGHT)sx%(ENV_XVFB_DISPLAY_DEPTH)s
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb_error.log
priority=10

# ==========================================
# FFmpeg Video Capture
# Captures Xvfb display and encodes to H.264
# Output: Reads from pipe connected by WebRTC backend
# ==========================================
[program:ffmpeg]
command=/bin/bash -c "ffmpeg \
  -f %(ENV_FFMPEG_FORMAT)s \
  -framerate %(ENV_FFMPEG_INPUT_FRAMERATE)s \
  -video_size %(ENV_XVFB_DISPLAY_WIDTH)sx%(ENV_XVFB_DISPLAY_HEIGHT)s \
  -i %(ENV_DISPLAY)s.0 \
  -c:v %(ENV_FFMPEG_VIDEO_CODEC)s \
  -preset %(ENV_FFMPEG_PRESET)s \
  -crf 28 \
  -maxrate 2500k \
  -bufsize 3750k \
  -r %(ENV_FFMPEG_OUTPUT_FRAMERATE)s \
  -pix_fmt yuv420p \
  -f h264 \
  pipe:1 \
  2>/var/log/supervisor/ffmpeg.log"
autostart=false
autorestart=true
startsecs=2
stopasgroup=true
stdout_logfile=/tmp/ffmpeg/stream.h264
stderr_logfile=/var/log/supervisor/ffmpeg_error.log
priority=20
# Wait for Xvfb to start before starting FFmpeg
depends_on=xvfb

# ==========================================
# VNC Server (noVNC fallback)
# Provides fallback streaming if WebRTC fails
# ==========================================
[program:vnc]
command=/usr/bin/vncserver %(ENV_DISPLAY)s -geometry %(ENV_XVFB_DISPLAY_WIDTH)sx%(ENV_XVFB_DISPLAY_HEIGHT)s -depth %(ENV_XVFB_DISPLAY_DEPTH)s -dpi 100
autostart=false
autorestart=true
startsecs=5
stopasgroup=true
stdout_logfile=/var/log/supervisor/vnc.log
stderr_logfile=/var/log/supervisor/vnc_error.log
priority=20
depends_on=xvfb

# ==========================================
# Browser Control Service (placeholder)
# Will be replaced by actual Playwright service in Phase 2
# ==========================================
[program:browser-service]
command=/bin/sleep infinity
autostart=false
autorestart=false
stdout_logfile=/var/log/supervisor/browser-service.log
stderr_logfile=/var/log/supervisor/browser-service_error.log
priority=30

# ==========================================
# Event listener for process state changes
# Helps with monitoring and logging
# ==========================================
[eventlistener:processes]
command=supervisor_eventhandler
buffer_size=100
events=PROCESS_STATE
result_handler=supervisor_result_handler
